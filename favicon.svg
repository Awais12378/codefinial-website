<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with gradient -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#grad1)" />
  
  <!-- Inner design -->
  <rect x="8" y="8" width="48" height="48" rx="10" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
  
  <!-- CF Letters -->
  <text x="32" y="42" 
        font-family="Arial, sans-serif" 
        font-size="28" 
        font-weight="bold" 
        fill="white" 
        text-anchor="middle"
        style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">
    CF
  </text>
  
  <!-- Decorative elements -->
  <circle cx="16" cy="16" r="3" fill="white" opacity="0.6" />
  <circle cx="48" cy="48" r="3" fill="white" opacity="0.6" />
</svg>
